<section id="telemetria" class="content-section oculto">
                <div class="page-heading">
                    <div>
                        <h1>Monitor de telemetría y eventos</h1>
                        <p>Consulta eventos de ejemplo y despachos registrados en este navegador.</p>
                    </div>
                    <span class="badge disponible" id="telemetria-estado">Prototipo local</span>
                </div>
                <div class="telemetry-filters">
                    <div>
                        <label for="filtro-escaner">Escáner</label>
                        <select id="filtro-escaner">
                            <option>Todos</option>
                            <option>SCANNER-01</option>
                            <option>SCANNER-02</option>
                        </select>
                    </div>
                    <div>
                        <label for="rango-tiempo">Rango de tiempo</label>
                        <select id="rango-tiempo">
                            <option>Últimas 24 horas</option>
                            <option>Últimos 7 días</option>
                            <option>Todo el historial</option>
                        </select>
                    </div>
                    <button class="btn-primary" type="button" onclick="filtrarTelemetria()">Filtrar</button>
                </div>
                <div class="telemetry-grid">
                    <div class="table-card">
                        <div class="table-header">
                            <div>
                                <h3>Lecturas QR</h3>
                                <p id="telemetria-resumen">Registro de actividad de los escáneres</p>
                            </div>
                            <span class="badge disponible">Datos locales</span>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Escáner</th>
                                        <th>Código QR</th>
                                        <th>Fecha y hora</th>
                                        <th>Batería</th>
                                    </tr>
                                </thead>
                                <tbody id="telemetria-tabla"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="table-card alerts-card">
                        <div class="table-header">
                            <h3>Alertas y auditorías</h3>
                        </div>
                        <div id="telemetria-alertas"></div>
                    </div>
                </div>
            </section>
